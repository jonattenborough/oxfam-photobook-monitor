name: BHF full book inventory scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhf-full-book-inventory-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Scan complete BHF eBay book inventory via Browse API
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python bhf_full_scan.py

      - name: Upload exhaustive BHF snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bhf-full-scan
          path: data/bhf_full_scan.json
          if-no-files-found: error

      - name: Persist exhaustive BHF snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/bhf_full_scan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update BHF full inventory scan [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
          done
