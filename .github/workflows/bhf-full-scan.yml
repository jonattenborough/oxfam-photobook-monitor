name: BHF full book inventory scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bhf_full_scan.py"
      - ".github/workflows/bhf-full-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "bhf_full_scan.py"
      - ".github/workflows/bhf-full-scan.yml"

permissions:
  contents: write

concurrency:
  group: bhf-full-book-inventory-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-sort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - sort_name: newly_listed
            sort_code: "10"
          - sort_name: ending_soonest
            sort_code: "1"
          - sort_name: best_match
            sort_code: "12"
          - sort_name: price_low
            sort_code: "15"
          - sort_name: price_high
            sort_code: "16"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan one BHF storefront sort
        env:
          SORT_NAME: ${{ matrix.sort_name }}
          SORT_CODE: ${{ matrix.sort_code }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from external_monitor import request_html
          from bhf_full_scan import advertised_count, parse_store_page

          name = os.environ['SORT_NAME']
          code = os.environ['SORT_CODE']
          base = 'https://www.ebay.co.uk/str/britishheartfoundationshop/BOOKS/_i.html?store_cat=3893944012'
          by_id = {}
          counts = []
          pages = []

          def get_page(url):
              last_html = ''
              for attempt in range(1, 5):
                  last_html = request_html(url)
                  batch = parse_store_page(last_html, url)
                  if batch:
                      return last_html, batch, attempt
                  if attempt < 4:
                      time.sleep(1.2 * attempt)
              return last_html, [], 4

          for page in range(1, 11):
              url = f'{base}&_sop={code}' + (f'&_pgn={page}' if page > 1 else '')
              html, batch, attempts = get_page(url)
              count = advertised_count(html)
              if count is not None:
                  counts.append(count)
              ids = [str(x['external_id']) for x in batch]
              new_ids = [x for x in ids if x not in by_id]
              pages.append({'page': page, 'url': url, 'items': len(batch), 'new_items': len(new_ids), 'fetch_attempts': attempts})
              print(f'{name} page {page}: {len(batch)} items, {len(new_ids)} new, attempts={attempts}')
              if not batch:
                  break
              if page > 1 and not new_ids:
                  break
              for item in batch:
                  by_id[str(item['external_id'])] = item
              time.sleep(0.8)

          out = {'strategy_type': 'sort', 'strategy_name': name, 'sort_code': code, 'advertised_counts': sorted(set(counts)), 'unique_items': len(by_id), 'pages': pages, 'items': list(by_id.values())}
          Path('runtime').mkdir(exist_ok=True)
          path = Path('runtime') / f'bhf-sort-{code}.json'
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          print(f'{name}: wrote {len(by_id)} unique items to {path}')
          PY

      - name: Upload sort snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bhf-sort-${{ matrix.sort_code }}
          path: runtime/bhf-sort-${{ matrix.sort_code }}.json
          if-no-files-found: error

  scan-price-band:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - band: p00_0749
            lo: "0"
            hi: "7.49"
          - band: p0750_0849
            lo: "7.50"
            hi: "8.49"
          - band: p0850_0949
            lo: "8.50"
            hi: "9.49"
          - band: p0950_1199
            lo: "9.50"
            hi: "11.99"
          - band: p1200_1499
            lo: "12.00"
            hi: "14.99"
          - band: p1500_1999
            lo: "15.00"
            hi: "19.99"
          - band: p2000_2999
            lo: "20.00"
            hi: "29.99"
          - band: p3000_4999
            lo: "30.00"
            hi: "49.99"
          - band: p5000_9999
            lo: "50.00"
            hi: "99.99"
          - band: p10000_24999
            lo: "100.00"
            hi: "249.99"
          - band: p25000_plus
            lo: "250.00"
            hi: "99999.99"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan one BHF price band
        env:
          BAND: ${{ matrix.band }}
          LO: ${{ matrix.lo }}
          HI: ${{ matrix.hi }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from external_monitor import request_html
          from bhf_full_scan import advertised_count, parse_store_page

          band = os.environ['BAND']
          lo = os.environ['LO']
          hi = os.environ['HI']
          base = 'https://www.ebay.co.uk/str/britishheartfoundationshop/BOOKS/_i.html?store_cat=3893944012'
          by_id = {}
          counts = []
          pages = []

          def get_page(url):
              last_html = ''
              for attempt in range(1, 5):
                  last_html = request_html(url)
                  batch = parse_store_page(last_html, url)
                  if batch:
                      return last_html, batch, attempt
                  if attempt < 4:
                      time.sleep(1.2 * attempt)
              return last_html, [], 4

          for page in range(1, 11):
              url = f'{base}&_udlo={lo}&_udhi={hi}&_sop=10' + (f'&_pgn={page}' if page > 1 else '')
              html, batch, attempts = get_page(url)
              count = advertised_count(html)
              if count is not None:
                  counts.append(count)
              ids = [str(x['external_id']) for x in batch]
              new_ids = [x for x in ids if x not in by_id]
              pages.append({'page': page, 'url': url, 'items': len(batch), 'new_items': len(new_ids), 'fetch_attempts': attempts})
              print(f'{band} page {page}: {len(batch)} items, {len(new_ids)} new, attempts={attempts}')
              if not batch:
                  break
              if page > 1 and not new_ids:
                  break
              for item in batch:
                  by_id[str(item['external_id'])] = item
              if len(batch) < 40:
                  break
              time.sleep(0.8)

          out = {'strategy_type': 'price_band', 'strategy_name': band, 'lo': lo, 'hi': hi, 'advertised_counts': sorted(set(counts)), 'unique_items': len(by_id), 'pages': pages, 'items': list(by_id.values())}
          Path('runtime').mkdir(exist_ok=True)
          path = Path('runtime') / f'bhf-price-{band}.json'
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          print(f'{band}: wrote {len(by_id)} unique items to {path}')
          PY

      - name: Upload price-band snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bhf-price-${{ matrix.band }}
          path: runtime/bhf-price-${{ matrix.band }}.json
          if-no-files-found: error

  aggregate:
    needs: [scan-sort, scan-price-band]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download BHF snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: bhf-*
          path: runtime/bhf-parts
          merge-multiple: true

      - name: Union, validate and rank BHF catalogue
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from bhf_full_scan import score_item

          files = sorted(Path('runtime/bhf-parts').glob('bhf-*.json'))
          if not files:
              raise SystemExit('No BHF artifacts were available')

          by_id = {}
          counts = []
          strategy_stats = []
          for path in files:
              data = json.loads(path.read_text())
              counts.extend(data.get('advertised_counts') or [])
              before = len(by_id)
              for item in data.get('items') or []:
                  item_id = str(item['external_id'])
                  existing = by_id.get(item_id)
                  if existing is None:
                      by_id[item_id] = item
                  else:
                      if existing.get('price_gbp') is None and item.get('price_gbp') is not None:
                          existing['price_gbp'] = item.get('price_gbp')
                      if len(str(item.get('context') or '')) > len(str(existing.get('context') or '')):
                          existing['context'] = item.get('context')
              strategy_stats.append({
                  'strategy_type': data.get('strategy_type'),
                  'strategy_name': data.get('strategy_name'),
                  'unique_items': data.get('unique_items'),
                  'new_items_added_to_union': len(by_id) - before,
                  'union_after_strategy': len(by_id),
                  'pages': data.get('pages'),
              })

          total = len(by_id)
          advertised = max(counts) if counts else None
          shortfall = (advertised - total) if advertised is not None else None
          complete = advertised is not None and shortfall <= 5

          candidates = []
          for item in by_id.values():
              score, reasons = score_item(item)
              if score < 4:
                  continue
              candidates.append({'item_id': item['external_id'], 'title': item.get('title'), 'price_gbp': item.get('price_gbp'), 'url': item.get('url'), 'context': item.get('context'), 'score': score, 'score_reasons': reasons})
          candidates.sort(key=lambda x: (-x['score'], x['price_gbp'] if isinstance(x.get('price_gbp'), (int, float)) else 999999, str(x.get('title') or '').lower()))

          all_items = [{'item_id': item['external_id'], 'title': item.get('title'), 'price_gbp': item.get('price_gbp'), 'url': item.get('url'), 'context': item.get('context')} for item in by_id.values()]
          all_items.sort(key=lambda x: str(x.get('title') or '').lower())

          snapshot = {
              'generated_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'source': 'British Heart Foundation eBay Books',
              'advertised_catalogue_count': advertised,
              'catalogue_counts_seen': sorted(set(counts)),
              'unique_items_scanned': total,
              'shortfall': shortfall,
              'full_scan_complete': complete,
              'strategies_run': strategy_stats,
              'candidate_count': len(candidates),
              'candidates': candidates,
              'all_items': all_items,
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/bhf_full_scan.json').write_text(json.dumps(snapshot, ensure_ascii=False, indent=2) + '\n')

          print(f'BHF union: {total} unique items, advertised={advertised}, shortfall={shortfall}, complete={complete}')
          print('Strategy contributions:')
          for stat in strategy_stats:
              print(stat['strategy_type'], stat['strategy_name'], 'unique', stat['unique_items'], 'added', stat['new_items_added_to_union'], 'union', stat['union_after_strategy'])
          print('Top 150 candidates:')
          for item in candidates[:150]:
              price = f"£{item['price_gbp']:.2f}" if isinstance(item.get('price_gbp'), (int, float)) else 'price n/a'
              print(f"{item['score']:>3} | {price:>10} | {item['title']} | {item['url']}")
          PY

      - name: Upload aggregate BHF snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bhf-full-scan
          path: data/bhf_full_scan.json
          if-no-files-found: error

      - name: Persist exhaustive BHF snapshot
        if: github.event_name != 'pull_request'
        run: |
          if ! jq -e '.full_scan_complete == true' data/bhf_full_scan.json >/dev/null; then
            echo "BHF union is incomplete, not persisting it as a completed baseline"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/bhf_full_scan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update BHF full inventory scan [skip ci]"
          git push
