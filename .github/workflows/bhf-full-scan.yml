name: BHF full book inventory scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bhf_full_scan.py"
      - ".github/workflows/bhf-full-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "bhf_full_scan.py"
      - ".github/workflows/bhf-full-scan.yml"

permissions:
  contents: write

concurrency:
  group: bhf-full-book-inventory-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Inspect embedded BHF eBay listing records
        run: |
          python - <<'PY'
          import re
          from external_monitor import request_html, EBAY_ITEM_RE

          url = "https://www.ebay.co.uk/str/britishheartfoundationshop/BOOKS/_i.html?store_cat=3893944012&_sop=10"
          html = request_html(url)
          print("HTML", len(html), "itm tokens", html.lower().count("/itm/"))
          ids = []
          for m in EBAY_ITEM_RE.finditer(html):
              item_id = m.group("id")
              if item_id not in ids:
                  ids.append(item_id)
              if len(ids) <= 5:
                  lo = max(0, m.start() - 900)
                  hi = min(len(html), m.end() + 1200)
                  print("ITEM", item_id)
                  print(repr(html[lo:hi]))
                  print("====")
          print("UNIQUE IDS", len(ids), ids[:10])
          for needle in ["itemTitle", "title", "price", "itemId", "legacyItemId", "listingId"]:
              print("NEEDLE", needle, html.find(needle))
          PY

      - name: Scan every publicly exposed BHF book page
        if: false
        run: python bhf_full_scan.py
