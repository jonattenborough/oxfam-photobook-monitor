name: BHF full book inventory scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bhf_full_scan.py"
      - ".github/workflows/bhf-full-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "bhf_full_scan.py"
      - ".github/workflows/bhf-full-scan.yml"

permissions:
  contents: write

concurrency:
  group: bhf-full-book-inventory-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Diagnose public BHF eBay listing endpoints
        run: |
          python - <<'PY'
          from external_monitor import request_html, parse_ebay

          urls = [
              "https://www.ebay.co.uk/str/britishheartfoundationshop/BOOKS/_i.html?store_cat=3893944012&_sop=10",
              "https://www.ebay.co.uk/sch/i.html?_ssn=bhf_shops&store_cat=3893944012&store_name=britishheartfoundationshop&_sop=10",
              "https://www.ebay.co.uk/sch/i.html?_ssn=bhf_shops&_sacat=261186&_sop=10",
              "https://www.ebay.co.uk/sch/i.html?_ssn=bhf_shops&_sacat=267&_sop=10",
          ]
          for url in urls:
              print("URL", url)
              try:
                  html = request_html(url)
                  source = {"id":"diag","source_name":"diag","kind":"ebay","url":url}
                  parsed = parse_ebay(source, html)
                  print("HTML", len(html), "itm tokens", html.lower().count("/itm/"), "parsed", len(parsed))
                  print("HEAD", repr(html[:350]))
                  print("TITLES", [x.get("title") for x in parsed[:5]])
              except Exception as exc:
                  print("ERROR", repr(exc))
              print("---")
          PY

      - name: Scan every publicly exposed BHF book page
        if: false
        run: python bhf_full_scan.py
