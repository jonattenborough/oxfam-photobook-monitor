name: BHF full book inventory scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bhf_full_scan.py"
      - ".github/workflows/bhf-full-scan.yml"

permissions:
  contents: write

concurrency:
  group: bhf-full-book-inventory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The scanner fails rather than claiming completeness if eBay repeats pages.
      - name: Scan every publicly exposed BHF book page
        run: python bhf_full_scan.py

      - name: Persist exhaustive BHF snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/bhf_full_scan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update BHF full inventory scan [skip ci]"
          git push
