name: BHF full book inventory scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhf-full-book-inventory-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # eBay may block GitHub-hosted runners. Keep this diagnostic inventory
      # scanner manual-only so it can never break or spam the live monitors.
      - name: Scan every publicly exposed BHF book page
        run: python bhf_full_scan.py

      - name: Upload exhaustive BHF snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bhf-full-scan
          path: data/bhf_full_scan.json
          if-no-files-found: error

      - name: Persist exhaustive BHF snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/bhf_full_scan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update BHF full inventory scan [skip ci]"
          git push
