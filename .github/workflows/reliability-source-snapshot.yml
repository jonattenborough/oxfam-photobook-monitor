name: Reliability development source snapshot

on:
  push:
    branches: [fix/photobook-reliability-20260918]
    paths: [.github/workflows/reliability-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked public source for isolated tests
        run: git archive --format=zip HEAD -o /tmp/photobook-reliability-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: photobook-reliability-source
          path: /tmp/photobook-reliability-source.zip
          retention-days: 1
