name: Charity photobook monitor

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - "charity_monitor.py"
      - "parr_badger_runner.py"
      - "canon_runner.py"
      - "data/parr_badger_master/**"
      - "data/roth_101_master.csv"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: charity-photobook-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate combined photobook canon
        run: python canon_runner.py self-test

      - name: Query Oxfam and detect new listings
        id: oxfam
        run: python canon_runner.py monitor

      - name: Query Shelter and Crisis
        id: charity
        run: python canon_runner.py charity_monitor

      - name: Create Oxfam analysis issue
        if: steps.oxfam.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/issue-title.txt)" \
            --body-file runtime/issue-body.md

      - name: Create Shelter/Crisis analysis issue
        if: steps.charity.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/charity/issue-title.txt)" \
            --body-file runtime/charity/issue-body.md

      - name: Persist monitor state only when catalogue data changed
        env:
          OXFAM_CHANGED: ${{ steps.oxfam.outputs.state_changed }}
        run: |
          set -euo pipefail
          changed=false

          if [ "$OXFAM_CHANGED" = "true" ]; then
            cp runtime/proposed-state.json data/state.json
            changed=true
          fi

          jq 'del(.last_checked) | .products |= with_entries(.value |= del(.last_seen))' data/charity_state.json > /tmp/charity-old.json
          jq 'del(.last_checked) | .products |= with_entries(.value |= del(.last_seen))' runtime/charity/proposed-state.json > /tmp/charity-new.json
          if ! cmp -s /tmp/charity-old.json /tmp/charity-new.json; then
            cp runtime/charity/proposed-state.json data/charity_state.json
            changed=true
          fi

          if [ "$changed" != "true" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json data/charity_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update charity monitor state [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
          done
