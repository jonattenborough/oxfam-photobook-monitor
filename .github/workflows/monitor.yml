name: Oxfam photobook monitor

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: oxfam-photobook-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Query Oxfam and detect new listings
        id: monitor
        run: python monitor.py

      - name: Create analysis issue for new listings
        if: steps.monitor.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/issue-title.txt)" \
            --body-file runtime/issue-body.md

      - name: Persist monitor state
        if: steps.monitor.outputs.state_changed == 'true'
        run: |
          cp runtime/proposed-state.json data/state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Oxfam monitor state [skip ci]"
          git push
