name: Charity photobook monitor

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - "charity_monitor.py"
      - "external_monitor.py"
      - "bhf_full_scan.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: charity-photobook-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Query Oxfam and detect new listings
        id: oxfam
        run: python monitor.py

      - name: Query Shelter and Crisis
        id: charity
        run: python charity_monitor.py

      - name: Query external charity and used-book pages
        id: external
        run: python external_monitor.py

      - name: Seed exhaustive BHF book inventory snapshot
        if: ${{ hashFiles('data/bhf_full_scan.json') == '' }}
        run: python bhf_full_scan.py

      - name: Create Oxfam analysis issue
        if: steps.oxfam.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/issue-title.txt)" \
            --body-file runtime/issue-body.md

      - name: Create Shelter/Crisis analysis issue
        if: steps.charity.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/charity/issue-title.txt)" \
            --body-file runtime/charity/issue-body.md

      - name: Create external analysis issue
        if: steps.external.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/external/issue-title.txt)" \
            --body-file runtime/external/issue-body.md

      - name: Persist monitor state only when catalogue data changed
        env:
          OXFAM_CHANGED: ${{ steps.oxfam.outputs.state_changed }}
          EXTERNAL_CHANGED: ${{ steps.external.outputs.state_changed }}
        run: |
          set -euo pipefail
          changed=false

          if [ "$OXFAM_CHANGED" = "true" ]; then
            cp runtime/proposed-state.json data/state.json
            changed=true
          fi

          jq 'del(.last_checked) | .products |= with_entries(.value |= del(.last_seen))' data/charity_state.json > /tmp/charity-old.json
          jq 'del(.last_checked) | .products |= with_entries(.value |= del(.last_seen))' runtime/charity/proposed-state.json > /tmp/charity-new.json
          if ! cmp -s /tmp/charity-old.json /tmp/charity-new.json; then
            cp runtime/charity/proposed-state.json data/charity_state.json
            changed=true
          fi

          if [ "$EXTERNAL_CHANGED" = "true" ]; then
            cp runtime/external/proposed-state.json data/external_state.json
            changed=true
          fi

          if [ -f data/bhf_full_scan.json ]; then
            git add -- data/bhf_full_scan.json
            if ! git diff --cached --quiet; then
              changed=true
            fi
          fi

          if [ "$changed" != "true" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json data/charity_state.json data/external_state.json
          if [ -f data/bhf_full_scan.json ]; then
            git add -- data/bhf_full_scan.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update charity monitor state [skip ci]"
          git push
