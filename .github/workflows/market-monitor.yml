name: Comprehensive photobook market discovery

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "market_monitor.py"
      - "market_monitor_safe.py"
      - "parr_badger_runner.py"
      - "external_monitor.py"
      - "charity_monitor.py"
      - "data/parr_badger_master/**"
      - ".github/workflows/market-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: comprehensive-photobook-market-discovery
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Parr Badger market matcher
        run: python market_monitor.py --self-test

      - name: Search live-tested wider photobook market sources
        id: market
        run: python market_monitor_safe.py --targets-per-run 12

      - name: Create AI review issue for new market matches
        if: steps.market.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/market/issue-title.txt)" \
            --body-file runtime/market/issue-body.md

      - name: Persist comprehensive market state
        if: steps.market.outputs.state_changed == 'true'
        run: |
          set -euo pipefail
          cp runtime/market/proposed-state.json data/market_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update comprehensive market monitor state [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
          done
