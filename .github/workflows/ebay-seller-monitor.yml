name: eBay charity seller photobook monitor

on:
  schedule:
    - cron: "9 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ebay_seller_monitor.py"
      - "ebay_charity_issue_sync.py"
      - "test_ebay_seller_monitor.py"
      - "test_ebay_charity_issue_sync.py"
      - ".github/workflows/ebay-seller-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: ebay-charity-seller-photobook-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Synchronize latest main state
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate seller monitor and eBay API client
        run: python -m unittest -v test_ebay_api.py test_ebay_core_targets.py test_ebay_seller_monitor.py

      - name: Check monitored sellers for new photography books
        if: github.event_name != 'pull_request'
        id: sellers
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python ebay_seller_monitor.py --sellers-per-run 12

      - name: Create AI review issue for new seller candidates
        if: github.event_name != 'pull_request' && steps.sellers.outputs.issue_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python ebay_charity_issue_sync.py --repository "$GITHUB_REPOSITORY"
          shopt -s nullglob
          for body in runtime/ebay-sellers/alerts/*.md; do
            stem="${body%.md}"
            title="$(cat "${stem}.title")"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body"
          done

      - name: Persist eBay seller state
        if: github.event_name != 'pull_request' && steps.sellers.outputs.state_changed == 'true'
        run: |
          set -euo pipefail
          cp runtime/ebay-sellers/proposed-state.json data/ebay_seller_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ebay_seller_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update eBay seller monitor state [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
          done
