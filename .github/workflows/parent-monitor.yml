name: Oxfam broad Art and Photography monitor

on:
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "oxfam_parent_common.py"
      - "parent_monitor.py"
      - "parr_badger_runner.py"
      - "canon_runner.py"
      - "data/parr_badger_master/**"
      - "data/roth_101_master.csv"
      - ".github/workflows/parent-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: oxfam-parent-art-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate combined photobook canon
        run: python canon_runner.py self-test

      - name: Query broad Oxfam Art and Photography category
        id: monitor
        run: python canon_runner.py parent_monitor

      # Create every generated batch before advancing the seen-listing state.
      - name: Create AI review issues for new parent-category listings
        if: steps.monitor.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ISSUES: ${{ steps.monitor.outputs.issue_count }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bodies=(runtime/parent_monitor/issues/*-body.md)
          if [ "${#bodies[@]}" -ne "$EXPECTED_ISSUES" ]; then
            echo "Expected $EXPECTED_ISSUES issue batches, found ${#bodies[@]}"
            exit 1
          fi
          for body in "${bodies[@]}"; do
            stem="${body%-body.md}"
            title_file="${stem}-title.txt"
            gh issue create \
              --title "$(cat "$title_file")" \
              --body-file "$body"
          done

      - name: Persist broad-category monitor state
        if: steps.monitor.outputs.state_changed == 'true'
        run: |
          set -euo pipefail
          cp runtime/parent_monitor/proposed-state.json data/parent_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/parent_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Oxfam parent-category monitor state [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
          done
