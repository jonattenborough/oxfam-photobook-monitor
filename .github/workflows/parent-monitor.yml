name: Oxfam broad Art and Photography monitor

on:
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "oxfam_parent_common.py"
      - "parent_monitor.py"
      - ".github/workflows/parent-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: oxfam-parent-art-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Query broad Oxfam Art and Photography category
        id: monitor
        run: python parent_monitor.py

      - name: Create AI review issue for new parent-category listings
        if: steps.monitor.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat runtime/parent_monitor/issue-title.txt)" \
            --body-file runtime/parent_monitor/issue-body.md

      - name: Persist broad-category monitor state
        if: steps.monitor.outputs.state_changed == 'true'
        run: |
          set -euo pipefail
          cp runtime/parent_monitor/proposed-state.json data/parent_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/parent_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Oxfam parent-category monitor state [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
          done
