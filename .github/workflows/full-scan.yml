name: Oxfam full catalogue scan

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Crawl entire Oxfam category
        run: python full_scan.py

      - name: Commit catalogue snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/full_catalogue.json data/full_candidates.json
          if git diff --cached --quiet; then
            echo "No catalogue changes to commit"
          else
            git commit -m "Update full Oxfam catalogue scan"
            git push
          fi

      - name: Create scan-ready issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(python - <<'PY'
          import json
          d=json.load(open('data/full_catalogue.json'))
          print(d.get('unique_skus', 0))
          PY
          )
          gh issue create \
            --title "OXFAM_FULL_SCAN_READY: ${COUNT} listings" \
            --body-file runtime/full_scan.md
