name: Charity existing inventory scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charity-existing-inventory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Scan current Shelter and Crisis inventories
        run: python charity_full_scan.py

      - name: Persist ranked candidate snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/charity_full_candidates.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update charity full-scan candidates [skip ci]"
          git push
